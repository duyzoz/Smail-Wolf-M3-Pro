<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="SMAILWOLF M3 Pro Clean-Room Rust Driver Schematic">
  <defs>
    <pattern id="cadGrid_dark" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1E2640" stroke-width="0.9"/>
    </pattern>
    <pattern id="cadMajor_dark" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="#26314F" stroke-width="1"/>
    </pattern>
    <linearGradient id="accentBar_dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="55%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#A78BFA"/>
    </linearGradient>
    <radialGradient id="sensorGlow_dark" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F97316" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#38BDF8" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#0B0E17" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="mouseBody_dark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#14192B"/>
      <stop offset="100%" stop-color="#121728"/>
    </linearGradient>
  </defs>

  <!-- Base Architectural Sheet -->
  <rect x="0.5" y="0.5" width="1199" height="359" rx="22" fill="#0B0E17" stroke="#26314F" stroke-width="1.2"/>
  <rect x="1" y="1" width="1198" height="358" rx="21.5" fill="url(#cadGrid_dark)" opacity="0.8"/>
  <rect x="1" y="1" width="1198" height="358" rx="21.5" fill="url(#cadMajor_dark)" opacity="0.55"/>

  <!-- Top Precision Spectrum Hairline -->
  <rect x="36" y="20" width="1128" height="3" rx="1.5" fill="url(#accentBar_dark)"/>

  <!-- Corner Registration Marks -->
  <g stroke="#F97316" stroke-width="1.5" fill="none" opacity="0.85">
    <path d="M 22 44 L 22 22 L 44 22"/>
    <path d="M 1178 44 L 1178 22 L 1156 22"/>
    <path d="M 22 316 L 22 338 L 44 338"/>
    <path d="M 1178 316 L 1178 338 L 1156 338"/>
  </g>

  <!-- Top Telemetry Spec Bar -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="700" letter-spacing="1.4">
    <rect x="44" y="42" width="292" height="26" rx="13" fill="#2A160B" stroke="#F97316" stroke-width="1"/>
    <circle cx="60" cy="55" r="4" fill="#F97316"/>
    <text x="73" y="59" fill="#F97316">CLEAN-ROOM RUST + TAURI 2 · v3.0.13</text>

    <rect x="348" y="42" width="234" height="26" rx="13" fill="#0C2438" stroke="#38BDF8" stroke-width="1"/>
    <text x="364" y="59" fill="#38BDF8">WEBHID 0xFF01 · 64B WIRE</text>

    <text x="1152" y="59" text-anchor="end" fill="#64748B">DWG NO. M3P-PAW3311-FW213</text>
  </g>

  <!-- Left Editorial Display Typography -->
  <g transform="translate(44, 108)">
    <text x="0" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.6" fill="#F8FAFC">SMAILWOLF</text>
    <text x="320" y="34" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="52" font-weight="800" letter-spacing="-1.6" fill="#F97316">M3 PRO</text>
    <text x="0" y="68" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="15" font-weight="700" letter-spacing="2.4" fill="#94A3B8">NATIVE CROSS-PLATFORM HARDWARE DRIVER REMAKE</text>
    <text x="0" y="106" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#94A3B8">Zero kernel drivers. Zero vendor bloatware. Measured live on the real USB bus,</text>
    <text x="0" y="130" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#94A3B8">verified with mod-256 checksums, 154 automated tests, and 67 sculpted 3D skins.</text>

    <!-- Inline Spec Chips -->
    <g transform="translate(0, 156)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11.5" font-weight="700">
      <rect x="0" y="0" width="128" height="32" rx="8" fill="#14192B" stroke="#3A4B75"/>
      <text x="14" y="20" fill="#F8FAFC">18 MB</text>
      <text x="64" y="20" fill="#64748B">NATIVE</text>

      <rect x="138" y="0" width="154" height="32" rx="8" fill="#14192B" stroke="#3A4B75"/>
      <text x="152" y="20" fill="#F97316">12,000</text>
      <text x="206" y="20" fill="#64748B">PAW3311</text>

      <rect x="302" y="0" width="144" height="32" rx="8" fill="#14192B" stroke="#3A4B75"/>
      <text x="316" y="20" fill="#38BDF8">1,000 Hz</text>
      <text x="384" y="20" fill="#64748B">1.0 MS</text>

      <rect x="456" y="0" width="186" height="32" rx="8" fill="#14192B" stroke="#3A4B75"/>
      <text x="470" y="20" fill="#34D399">WIN · MAC · LINUX</text>
    </g>
  </g>

  <!-- Right Side: Precision CAD Wireframe Mouse Schematic -->
  <g transform="translate(880, 182)">
    <!-- Optical Aura & Target Reticle -->
    <circle cx="0" cy="0" r="138" fill="url(#sensorGlow_dark)"/>
    <circle cx="0" cy="0" r="118" fill="none" stroke="#3A4B75" stroke-width="1" stroke-dasharray="4 5"/>
    <circle cx="0" cy="0" r="88" fill="none" stroke="#38BDF8" stroke-width="0.9" opacity="0.45"/>

    <!-- Crosshair Axes -->
    <line x1="-148" y1="0" x2="148" y2="0" stroke="#3A4B75" stroke-width="0.9" stroke-dasharray="3 4"/>
    <line x1="0" y1="-132" x2="0" y2="132" stroke="#3A4B75" stroke-width="0.9" stroke-dasharray="3 4"/>

    <!-- Contoured M3 Pro Silhouette (Rotated 12deg) -->
    <g transform="rotate(12)">
      <path d="M -46 -68 C -46 -98 -24 -108 0 -108 C 24 -108 46 -98 46 -68 L 51 16 C 53 74 34 108 0 108 C -34 108 -53 74 -51 16 Z"
            fill="url(#mouseBody_dark)" stroke="#94A3B8" stroke-width="2.2"/>
      <!-- Left/Right Split Seam -->
      <path d="M -47 -24 Q 0 -16 47 -24" fill="none" stroke="#3A4B75" stroke-width="1.3"/>
      <line x1="0" y1="-108" x2="0" y2="-20" stroke="#3A4B75" stroke-width="1.3"/>
      <!-- Scroll Wheel -->
      <rect x="-7" y="-82" width="14" height="30" rx="7" fill="#0B0E17" stroke="#F97316" stroke-width="1.8"/>
      <line x1="0" y1="-76" x2="0" y2="-58" stroke="#F97316" stroke-width="1.5" stroke-dasharray="2 3"/>
      <!-- DPI Micro Button -->
      <rect x="-4.5" y="-42" width="9" height="16" rx="4.5" fill="#0C2438" stroke="#38BDF8" stroke-width="1.4"/>
      <!-- Side Thumb Buttons (Copy / Paste) -->
      <rect x="-53" y="-34" width="5" height="22" rx="2.5" fill="#F97316"/>
      <rect x="-54" y="-6" width="5" height="22" rx="2.5" fill="#38BDF8"/>
      <!-- Internal PAW3311 Optical Core Box -->
      <rect x="-15" y="-2" width="30" height="30" rx="5" fill="none" stroke="#F97316" stroke-width="1.3" stroke-dasharray="3 2"/>
      <circle cx="0" cy="13" r="6" fill="none" stroke="#F97316" stroke-width="1.5"/>
      <circle cx="0" cy="13" r="2.2" fill="#F97316"/>
      <!-- Internal 500mAh Li-Po Cell Outline -->
      <rect x="-24" y="42" width="48" height="34" rx="6" fill="none" stroke="#34D399" stroke-width="1.2" stroke-dasharray="4 2"/>
      <text x="0" y="63" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="8.5" font-weight="700" fill="#34D399">500 mAh</text>
    </g>

    <!-- Engineering Leader Callouts -->
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="700">
      <!-- Top Left: Wheel/Switch -->
      <polyline points="-38,-68 -88,-96 -142,-96" fill="none" stroke="#F97316" stroke-width="1.2"/>
      <circle cx="-38" cy="-68" r="3" fill="#F97316"/>
      <text x="-146" y="-92" text-anchor="end" fill="#F8FAFC">HUANO 80M</text>

      <!-- Mid Right: PAW3311 -->
      <polyline points="22,8 92,8 134,-18 164,-18" fill="none" stroke="#38BDF8" stroke-width="1.2"/>
      <circle cx="22" cy="8" r="3" fill="#38BDF8"/>
      <text x="170" y="-14" fill="#38BDF8">PAW3311</text>
      <text x="170" y="-1" font-size="8.5" fill="#64748B">300 IPS · 35G</text>

      <!-- Bottom Right: MCU -->
      <polyline points="28,60 94,76 164,76" fill="none" stroke="#34D399" stroke-width="1.2"/>
      <circle cx="28" cy="60" r="3" fill="#34D399"/>
      <text x="170" y="74" fill="#34D399">FR2012A</text>
      <text x="170" y="87" font-size="8.5" fill="#64748B">48 MHZ · FW 2.1.3</text>
    </g>
  </g>

  <!-- Bottom Transistor Ticker Rule -->
  <line x1="36" y1="322" x2="1164" y2="322" stroke="#26314F" stroke-width="1"/>
  <text x="44" y="341" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10" font-weight="700" letter-spacing="2.2" fill="#64748B">DESIGNED AT THE TRANSISTOR · NOTHING IDLE · EVERY CLICK JUSTIFIED · EVERY DPI EARNED · NO WASTED CYCLES</text>
</svg>